    html.admin-auth-pending #app{visibility:hidden!important}
    #app .section-title:has(+ #myList){display:none}
    #app:has(#myList) > .appbar,
    #app:has(> .screen > .result) > .appbar,
    #app:has(> .screen.driver-result-refined-screen) > .appbar{
      padding-top:14px!important;padding-bottom:14px!important;min-height:68px!important
    }
    #app:has(#myList) > .appbar .sub{display:none!important}
    #app:has(#myList) .profile-card{display:none!important}
    .appbar-home{flex:none;order:3;margin-left:8px;width:40px;height:40px;border-radius:11px;border:0;cursor:pointer;
      background:rgba(255,255,255,.14);color:#fff;font-size:20px;line-height:1;
      display:grid;place-items:center}
  </style>
  <script>
    (() => {
      const nativeFetch = window.fetch.bind(window);
      window.fetch = async (...args) => {
        const response = await nativeFetch(...args);
        try {
          const url = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
          if (url.includes('/api/auth/login') && response.ok) {
            const data = await response.clone().json();
            if (data?.user?.role === 'staff' && data?.user?.staffRole === 'admin') {
              document.documentElement.classList.add('admin-auth-pending');
              setTimeout(() => {
                window.dispatchEvent(new CustomEvent('entrypass:admin-login', {
                  detail: { user: data.user },
                }));
              }, 0);
            }
          }
        } catch { /* 원래 로그인 흐름 유지 */ }
        return response;
      };
      setTimeout(() => document.documentElement.classList.remove('admin-auth-pending'), 5000);
    })();
  </script>
