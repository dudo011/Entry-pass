# Cloudflare Workers 설정
# 배포 절차는 DEPLOY.md 참고.
name = "entry-pass"
main = "src/worker-v6.js"
compatibility_date = "2024-11-01"

# 정적 프런트엔드(public/)를 Workers 에서 함께 서빙
[assets]
directory = "./public"
binding = "ASSETS"

# 매일 한국시간 오전 3시에 보존기간이 지난 신청·첨부파일을 정리합니다.
[triggers]
crons = ["0 18 * * *"]

# D1 데이터베이스 (사용자/세션/신청 + 첨부 서류 저장)
# `wrangler d1 create entry-pass-db` 실행 후 출력된 database_id 를 붙여넣으세요.
[[d1_databases]]
binding = "DB"
database_name = "entry-pass-db"
database_id = "0008ce41-b615-4871-9a83-4140003a724d"

# 첨부 서류는 D1에 저장하므로 R2 버킷은 사용하지 않습니다 (결제카드 불필요).
